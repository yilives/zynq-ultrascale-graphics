# Xorg supplies real USB input and a CPU window. RasterIX outputs to PL LCD.
Section "ServerLayout"
    Identifier "RasterIX"
    Screen 0 "RasterIXScreen"
    Option "AutoAddDevices" "true"
EndSection
Section "Device"
    Identifier "RasterIXInputWindow"
    Driver "dummy"
    VideoRam 4096
EndSection
Section "Monitor"
    Identifier "RasterIXMonitor"
    HorizSync 20-100
    VertRefresh 20-100
    Modeline "400x240" 12.000 400 416 448 512 240 243 246 260
EndSection
Section "Screen"
    Identifier "RasterIXScreen"
    Device "RasterIXInputWindow"
    Monitor "RasterIXMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "400x240"
        Virtual 400 240
    EndSubSection
EndSection
